<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Shortfall Modal - The Grand Reserve</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&amp;family=Inter:wght@400;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#2f3033",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#001c3b",
                        "on-error-container": "#93000a",
                        "background": "#faf9fc",
                        "surface-tint": "#455f87",
                        "danger": "#B42318",
                        "secondary": "#735c00",
                        "inverse-primary": "#adc8f5",
                        "cream": "#F8F1DF",
                        "surface-bright": "#faf9fc",
                        "on-surface-variant": "#43474e",
                        "on-primary-container": "#8aa4cf",
                        "on-error": "#ffffff",
                        "success": "#0F766E",
                        "surface-container-high": "#e9e7eb",
                        "text-primary": "#1A1A1A",
                        "tertiary-fixed-dim": "#edbf7f",
                        "warning": "#B45309",
                        "on-secondary-container": "#745c00",
                        "secondary-container": "#fed65b",
                        "primary": "#022448",
                        "on-tertiary-fixed-variant": "#60410c",
                        "tertiary-container": "#503300",
                        "surface-dim": "#dad9dd",
                        "primary-fixed-dim": "#adc8f5",
                        "secondary-fixed": "#ffe088",
                        "surface-container": "#eeedf1",
                        "on-tertiary-fixed": "#291800",
                        "on-background": "#1a1c1e",
                        "cream-dark": "#EDE3CC",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#e9c349",
                        "primary-fixed": "#d5e3ff",
                        "primary-container": "#1e3a5f",
                        "on-tertiary-container": "#c69b5f",
                        "gold-light": "#F1E0A6",
                        "text-secondary": "#4A4A4A",
                        "surface-container-highest": "#e3e2e6",
                        "text-muted": "#6B7280",
                        "inverse-on-surface": "#f1f0f4",
                        "on-primary-fixed-variant": "#2d486d",
                        "surface-variant": "#e3e2e6",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c4c6cf",
                        "surface": "#faf9fc",
                        "on-tertiary": "#ffffff",

                        "gold-muted": "#B7922B",
                        "on-surface": "#1a1c1e",

                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#241a00",
                        "outline": "#74777f",
                        "tertiary-fixed": "#ffddb2",
                        "error-container": "#ffdad6",
                        "info": "#185FA5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "24px",
                        "topbar-height": "64px",
                        "sidebar-width": "260px",
                        "input-padding-x": "16px",
                        "input-padding-y": "12px",
                        "card-padding": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-uppercase": ["Inter"],
                        "h4": ["Playfair Display"],
                        "h3": ["Playfair Display"],
                        "h1": ["Playfair Display"],
                        "h2": ["Playfair Display"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-uppercase": ["13px", { "lineHeight": "1", "letterSpacing": "0.08em", "fontWeight": "600" }],
                        "h4": ["22px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "h3": ["28px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "h1": ["48px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "h2": ["36px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "1.7", "fontWeight": "400" }]

        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            /* Fallback for safe-area-inset */
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .modal-gradient {
            background: linear-gradient(135deg, #10243F 0%, #1E3A5F 100%);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-navy-deep min-h-screen text-on-primary flex flex-col items-center justify-end font-body-lg">
    <!-- Modal Overlay -->
    <div class="fixed inset-0 bg-navy-deep/90 backdrop-blur-md z-40"></div>
    <!-- Modal Content (Bottom Sheet Style) -->
    <div class="relative z-50 w-full max-w-md bg-navy-deep modal-gradient border-t border-gold-light/25 rounded-t-3xl shadow-[0_-8px_32px_rgba(0,0,0,0.5)] flex flex-col mt-auto"
        style="min-height: 85vh;">
        <!-- Drag Handle Indicator -->
        <div class="w-full flex justify-center pt-4 pb-2">
            <div class="w-12 h-1.5 bg-cream-dark/30 rounded-full"></div>
        </div>
        <!-- Header -->
        <div class="px-6 py-4 flex justify-between items-start border-b border-gold-light/10">
            <div>
                <h2 class="font-h3 text-h3 text-gold-light mb-1">Shortfall Detected</h2>
                <p class="font-body-lg text-body-lg text-cream-dark/70">Table 4 - Member #8492</p>
            </div>
            <button class="text-cream-dark/50 hover:text-gold-light transition-colors p-2 -mr-2">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto px-6 py-8 flex flex-col items-center">
            <!-- Amount Display -->
            <div
                class="text-center mb-10 w-full bg-primary-container/40 p-6 rounded-2xl border border-gold-light/20 relative overflow-hidden">
                <div
                    class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(241,224,166,0.05)_0%,transparent_70%)]">
                </div>
                <span
                    class="font-label-uppercase text-label-uppercase text-cream-dark/60 block mb-2 tracking-widest">Amount
                    Due</span>
                <div class="font-h1 text-h1 text-on-primary flex items-baseline justify-center gap-2">
                    <span class="font-h3 text-h3 text-gold-light">GHS</span>
                    250.00
                </div>
            </div>
            <!-- QR Code Area -->
            <div
                class="bg-white p-6 rounded-2xl shadow-lg border border-gold-light/30 mb-8 relative group cursor-pointer transition-transform duration-300 hover:scale-[1.02]">
                <!-- Decorative Corners -->
                <div class="absolute top-2 left-2 w-4 h-4 border-t-2 border-l-2 border-gold-muted/50 rounded-tl"></div>
                <div class="absolute top-2 right-2 w-4 h-4 border-t-2 border-r-2 border-gold-muted/50 rounded-tr"></div>
                <div class="absolute bottom-2 left-2 w-4 h-4 border-b-2 border-l-2 border-gold-muted/50 rounded-bl">
                </div>
                <div class="absolute bottom-2 right-2 w-4 h-4 border-b-2 border-r-2 border-gold-muted/50 rounded-br">
                </div>
                <img alt="Payment QR Code" class="w-48 h-48 object-cover mx-auto mix-blend-multiply"
                    data-alt="A high-contrast, perfectly square QR code rendered in deep navy blue (#10243F) on a stark white background. The QR code should appear modern and crisp, suitable for mobile scanning in a luxury application setting. The design should be clean, without any text or additional graphic elements interfering with the scannable code area, maintaining an elegant, high-end digital aesthetic."
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuCG2beQ6DvW2vM3v18tRphf0H6x4khsVUZMpzQXEG4PtZ1G404ZTQcAG7U_2cu9aGj2-Ow7SE8elBfibjefChyBVvkkBbvN7946AlTXnMf_fietOFTVn8ubI-Ra8BbgB0RoFdNvTrcN-qN0vRRe3xbXqA9gcwma8fYnWfRkqzwAV33qLKvCziql2ITo85y8fbJeTYeY4E7tBh_5ufrY9pdiH98E-41rnF4apZFWH9OJ-8f1TRubqXr3aEC-rWMmeppwSYEklm8" />
                <div class="mt-4 text-center">
                    <span class="font-label-uppercase text-label-uppercase text-navy-deep/70">Scan to Pay</span>
                </div>
            </div>
            <!-- Transaction Details List -->
            <div class="w-full space-y-4 mb-8">
                <div class="flex justify-between items-center py-3 border-b border-cream-dark/10">
                    <span class="font-body-lg text-body-lg text-cream-dark/70">Order Total</span>
                    <span class="font-body-lg text-body-lg text-on-primary">GHS 1,250.00</span>
                </div>
                <div class="flex justify-between items-center py-3 border-b border-cream-dark/10">
                    <span class="font-body-lg text-body-lg text-cream-dark/70">Account Balance</span>
                    <span class="font-body-lg text-body-lg text-danger">GHS 1,000.00</span>
                </div>
            </div>
        </div>
        <!-- Sticky Bottom Action -->
        <div class="px-6 py-6 pb-safe bg-navy-deep border-t border-gold-light/10">
            <button
                class="w-full bg-primary-container text-gold-light border border-gold-light/50 font-label-uppercase text-label-uppercase py-5 rounded-xl hover:bg-gold-light hover:text-navy-deep transition-all duration-300 flex items-center justify-center gap-3 shadow-[0_4px_20px_rgba(241,224,166,0.15)]">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Verify Payment
            </button>
        </div>
    </div>
</body>

</html>
