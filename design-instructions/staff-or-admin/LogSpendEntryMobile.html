<body class="bg-navy-deep min-h-screen text-on-surface font-body-lg flex flex-col md:hidden selection:bg-gold-light/30">
    <!-- Top Bar -->
    <header class="flex items-center justify-between px-gutter py-4 sticky top-0 z-10 bg-navy-deep">
        <button aria-label="Go Back" class="text-gold-light hover:text-white transition-colors">
            <span class="material-symbols-outlined text-[28px]" data-icon="arrow_back" data-weight="fill"
                style="font-variation-settings: 'FILL' 1;">arrow_back</span>
        </button>
        <h1 class="font-h3 text-h3 text-gold-light tracking-wide">Log Spend</h1>
        <button aria-label="Options" class="text-gold-light hover:text-white transition-colors">
            <span class="material-symbols-outlined text-[28px]" data-icon="more_vert" data-weight="fill"
                style="font-variation-settings: 'FILL' 1;">more_vert</span>
        </button>
    </header>
    <!-- Main Content Canvas -->
    <main class="flex-grow flex flex-col px-gutter pb-[80px] pt-4 overflow-y-auto">
        <!-- Member Info Card (Compact) -->
        <div
            class="bg-primary-container rounded-xl p-4 border border-gold-light/20 flex items-center gap-4 mb-8 shadow-sm shadow-navy-deep/20">
            <div class="w-12 h-12 rounded-full overflow-hidden border border-gold-light/50 flex-shrink-0">
                <img alt="Member Avatar" class="w-full h-full object-cover"
                    data-alt="A close-up portrait of an elegant woman in a softly lit, luxurious restaurant environment. High-contrast lighting with warm amber tones and deep shadows. Modern editorial aesthetic."
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7y6M586I4dc22__Hg8PqIfm-vBHRaFv8TslNegnIQ9aow8w6PBydmNUt8y3m2U4oERln5jiHrVHzYoeyz60Hkk4q696w3ohR8d4qGfCC9YnsmtoeayM2Ap6XLEkj94U5Z97kLuZp7LDwF-uvug52yCAVYQOlaQfWjteCNXGP7ZFsmoiFwq_E4wMIMMtLIeUanHacn2ViejeBiXdawyukW9nWKp0kDUOpQwqEedogjp57El-_e12vBKrUh6vU1vLeP0nO0IIE" />
            </div>
            <div class="flex-grow">
                <h2 class="font-h4 text-h4 text-white m-0">Eleanor Vance</h2>
                <p class="text-cream-dark/70 text-sm mt-1 flex items-center gap-1">
                    <span class="material-symbols-outlined text-[16px]" data-icon="star" data-weight="fill"
                        style="font-variation-settings: 'FILL' 1;">star</span>
                    Premier Member
                </p>
            </div>
        </div>
        <!-- Remaining Credit Highlight -->
        <div class="text-center mb-8">
            <p class="font-label-uppercase text-label-uppercase text-cream-dark/60 mb-2">Available Credit</p>
            <div class="inline-flex items-center gap-2">
                <span class="font-h2 text-h2 text-success">$1,250.00</span>
            </div>
        </div>
        <!-- Numeric Input Area -->
        <div class="flex-grow flex flex-col justify-center items-center mb-12">
            <div class="relative w-full max-w-[300px]">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <span class="font-h1 text-h1 text-gold-light/50">$</span>
                </div>
                <input autofocus=""
                    class="w-full bg-transparent border-b-2 border-gold-light/30 text-center font-h1 text-h1 text-white py-4 focus:outline-none focus:border-gold-light focus:ring-0 transition-colors placeholder-gold-light/20"
                    placeholder="0.00" step="0.01" type="number" />
            </div>
            <p class="text-cream-dark/50 mt-4 text-sm text-center max-w-[250px]">Enter total bill amount including
                gratuity.</p>
        </div>
        <!-- Action Button -->
        <div class="mt-auto">
            <button
                class="w-full bg-navy-deep border border-gold-light text-gold-light hover:bg-gold-light hover:text-navy-deep py-4 rounded-lg font-label-uppercase text-label-uppercase transition-all duration-300 active:scale-[0.98] shadow-[0_4px_24px_rgba(30,58,95,0.2)]">
                Confirm Spend
            </button>
        </div>
    </main>
    <!-- BottomNavBar (Shared Component JSON logic applied for styling, though contextually usually suppressed for transactional screens, requirement dictates inclusion) -->
    <nav
        class="lg:hidden fixed bottom-0 w-full z-50 flex justify-around items-center h-16 px-4 pb-safe bg-navy-deep border-t border-gold-light/25 shadow-[0_-4px_24px_rgba(16,36,63,0.3)] rounded-t-xl">
        <a class="flex flex-col items-center justify-center text-cream-dark/50 hover:text-gold-light transition-transform active:scale-90 duration-200"
            href="#">
            <span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
            <span class="font-label-uppercase text-label-uppercase text-[10px] mt-1">Book</span>
        </a>
        <a class="flex flex-col items-center justify-center text-gold-light scale-110 active:scale-90 duration-200"
            href="#">
            <span class="material-symbols-outlined" data-icon="payments">payments</span>
            <span class="font-label-uppercase text-label-uppercase text-[10px] mt-1">Spend</span>
        </a>
        <a class="flex flex-col items-center justify-center text-cream-dark/50 hover:text-gold-light transition-transform active:scale-90 duration-200"
            href="#">
            <span class="material-symbols-outlined" data-icon="credit_card">credit_card</span>
            <span class="font-label-uppercase text-label-uppercase text-[10px] mt-1">Card</span>
        </a>
        <a class="flex flex-col items-center justify-center text-cream-dark/50 hover:text-gold-light transition-transform active:scale-90 duration-200"
            href="#">
            <span class="material-symbols-outlined" data-icon="support_agent">support_agent</span>
            <span class="font-label-uppercase text-label-uppercase text-[10px] mt-1">Help</span>
        </a>
    </nav>
