<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>New Reservation - Estrella del Mar</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "surface-tint": "#455f87",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#edbf7f",
                        "tertiary-container": "#503300",
                        "surface-variant": "#e3e2e6",
                        "on-primary-fixed-variant": "#2d486d",
                        "inverse-primary": "#adc8f5",
                        "primary-container": "#1e3a5f",
                        "on-secondary-fixed": "#241a00",
                        "surface-dim": "#dad9dd",
                        "primary-fixed-dim": "#adc8f5",
                        "primary": "#022448",
                        "tertiary": "#341f00",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#faf9fc",
                        "info": "#185FA5",
                        "gold-muted": "#B7922B",
                        "secondary-fixed-dim": "#e9c349",
                        "background": "#faf9fc",
                        "danger": "#B42318",
                        "on-tertiary-container": "#c69b5f",
                        "text-muted": "#6B7280",
                        "surface-container-highest": "#e3e2e6",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e9e7eb",
                        "cream-dark": "#EDE3CC",
                        "surface-container-low": "#f4f3f7",
                        "primary-fixed": "#d5e3ff",
                        "on-surface-variant": "#43474e",
                        "on-background": "#1a1c1e",
                        "secondary": "#735c00",
                        "tertiary-fixed": "#ffddb2",
                        "text-secondary": "#4A4A4A",
                        "outline-variant": "#c4c6cf",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#291800",
                        "gold-light": "#F1E0A6",
                        "surface-bright": "#faf9fc",
                        "outline": "#74777f",
                        "text-primary": "#1A1A1A",
                        "secondary-fixed": "#ffe088",
                        "on-secondary-container": "#745c00",
                        "on-tertiary-fixed-variant": "#60410c",
                        "warning": "#B45309",
                        "success": "#0F766E",
                        "secondary-container": "#fed65b",
                        "cream": "#F8F1DF",
                        "navy-deep": "#10243F",
                        "inverse-surface": "#2f3033",
                        "surface-container": "#eeedf1",
                        "on-secondary-fixed-variant": "#574500",
                        "on-primary-container": "#8aa4cf",
                        "on-primary-fixed": "#001c3b",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f1f0f4",
                        "on-surface": "#1a1c1e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-padding": "24px",
                        "gutter": "16px",
                        "topbar-height": "64px",
                        "input-padding-x": "16px",
                        "sidebar-width": "260px",
                        "input-padding-y": "12px",
                        "container-margin": "24px",
                        "safe": "env(safe-area-inset-bottom)"
                    },
                    "fontFamily": {
                        "h2": [
                            "Playfair Display", "serif"
                        ],
                        "label-uppercase": [
                            "Inter", "sans-serif"
                        ],
                        "h4": [
                            "Playfair Display", "serif"
                        ],
                        "h3": [
                            "Playfair Display", "serif"
                        ],
                        "h1": [
                            "Playfair Display", "serif"
                        ],
                        "body-lg": [
                            "Inter", "sans-serif"
                        ]
                    },
                    "fontSize": {
                        "h2": [
                            "36px",
                            {
                                "lineHeight": "1.3",
                                "fontWeight": "600"
                            }
                        ],
                        "label-uppercase": [
                            "13px",
                            {
                                "lineHeight": "1",
                                "letterSpacing": "0.08em",
                                "fontWeight": "600"
                            }
                        ],
                        "h4": [
                            "22px",
                            {
                                "lineHeight": "1.4",
                                "fontWeight": "500"
                            }
                        ],
                        "h3": [
                            "28px",
                            {
                                "lineHeight": "1.4",
                                "fontWeight": "600"
                            }
                        ],
                        "h1": [
                            "48px",
                            {
                                "lineHeight": "1.2",
                                "fontWeight": "700"
                            }
                        ],
                        "body-lg": [
                            "16px",
                            {
                                "lineHeight": "1.7",
                                "fontWeight": "400"
                            }
                        ]
                    }
                },
            },
        }
    </script>
</head>

<body
    class="bg-cream font-body-lg text-text-primary antialiased min-h-screen flex flex-col pb-[calc(64px+env(safe-area-inset-bottom)+24px)] md:pb-0">
    <!-- Mobile Header Context (No TopNavBar on typical transactional sub-pages, but requirement mentions Top logo centered) -->
    <header
        class="w-full bg-navy-deep px-gutter py-4 flex flex-col items-center justify-center relative shadow-sm shadow-navy-deep/20 z-10 rounded-b-xl border-b border-gold-light/20">
        <!-- Optional Back Button for mobile feel if it was a subpage, but sticking strictly to prompt -->
        <button aria-label="Go Back" class="absolute left-gutter top-1/2 -translate-y-1/2 text-gold-light p-2">
            <span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
        </button>
        <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-gold-light/30">
            <img alt="Estrella del Mar Logo" class="w-full h-full object-cover"
                src="https://lh3.googleusercontent.com/aida/AP1WRLt34sFiL759IqKjljzG35zV_G8D-q9_JQkNcgOSa9nl66lHcDMjCbUQRqXtwPCgoZhymL8GB-mwXkatpVGhpTUO6BcxxuxJ7T5B41pXueUeV_WilG8vuOIEazByFSXRaqHbqzR4VYebkOCJKiu2cXxycBcZ0dIv3OLdeLDNmWf0WI7xio1Uq-tr2xGo36XyDShJroeydexs342X8cprtx-Ak9R-0mkaWMWDqUamfas8RklQjwB3QA" />
        </div>
        <h1 class="font-h4 text-h4 text-gold-light mt-2">New Reservation</h1>
    </header>
    <main
        class="flex-1 px-gutter py-container-margin md:max-w-md md:mx-auto md:w-full flex flex-col gap-6 relative z-0">
        <!-- Lavish Section: Experience Selection -->
        <section
            class="bg-surface rounded-xl p-card-padding border border-gold-light/25 shadow-[0_4px_24px_rgba(30,58,95,0.08)] relative overflow-hidden group">
            <div class="absolute inset-0 bg-gradient-to-br from-white/40 to-transparent pointer-events-none"></div>
            <h2 class="font-h4 text-h4 text-primary-container mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-gold-muted text-[24px]">restaurant</span>
                Experience
            </h2>
            <div class="grid grid-cols-2 gap-4">
                <button
                    class="flex flex-col items-center justify-center p-4 rounded-lg border-2 border-primary-container bg-primary-container/5 transition-all focus:ring-2 focus:ring-gold-muted/60 relative overflow-hidden group">
                    <span
                        class="material-symbols-outlined text-primary-container text-[32px] mb-2 group-active:scale-95 transition-transform">wine_bar</span>
                    <span class="font-label-uppercase text-label-uppercase text-primary-container">Dining</span>
                    <div
                        class="absolute -right-2 -top-2 w-8 h-8 bg-gold-light rounded-full mix-blend-multiply opacity-0 group-hover:opacity-20 transition-opacity">
                    </div>
                </button>
                <button
                    class="flex flex-col items-center justify-center p-4 rounded-lg border border-cream-dark bg-white transition-all hover:border-gold-light/50 focus:ring-2 focus:ring-gold-muted/60 text-text-secondary relative overflow-hidden group">
                    <span
                        class="material-symbols-outlined text-surface-tint text-[32px] mb-2 group-active:scale-95 transition-transform">spa</span>
                    <span class="font-label-uppercase text-label-uppercase text-text-secondary">Spa</span>
                </button>
            </div>
        </section>
        <!-- Simplified Date & Time Picker -->
        <section
            class="bg-surface rounded-xl p-card-padding border border-gold-light/25 shadow-[0_4px_24px_rgba(30,58,95,0.08)] relative overflow-hidden">
            <h2 class="font-h4 text-h4 text-primary-container mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-gold-muted text-[24px]">calendar_month</span>
                Date &amp; Time
            </h2>
            <div class="flex flex-col gap-4">
                <!-- Date Selector -->
                <div>
                    <label class="font-label-uppercase text-label-uppercase text-text-secondary mb-2 block">Select
                        Date</label>
                    <div class="flex gap-2 overflow-x-auto pb-2 -mx-2 px-2 scrollbar-hide snap-x">
                        <!-- Active Date -->
                        <button
                            class="flex-shrink-0 w-16 h-20 bg-primary-container rounded-lg flex flex-col items-center justify-center border border-gold-light/50 shadow-md snap-center relative">
                            <span
                                class="text-gold-light/70 text-xs font-semibold uppercase tracking-wider mb-1">Fri</span>
                            <span class="text-gold-light font-h3 text-h3 leading-none">24</span>
                            <div class="absolute bottom-1 w-1 h-1 bg-gold-light rounded-full"></div>
                        </button>
                        <!-- Inactive Dates -->
                        <button
                            class="flex-shrink-0 w-16 h-20 bg-white rounded-lg flex flex-col items-center justify-center border border-cream-dark hover:border-gold-light/30 transition-colors snap-center">
                            <span class="text-text-muted text-xs font-semibold uppercase tracking-wider mb-1">Sat</span>
                            <span class="text-text-primary font-h3 text-[22px] leading-none font-medium">25</span>
                        </button>
                        <button
                            class="flex-shrink-0 w-16 h-20 bg-white rounded-lg flex flex-col items-center justify-center border border-cream-dark hover:border-gold-light/30 transition-colors snap-center">
                            <span class="text-text-muted text-xs font-semibold uppercase tracking-wider mb-1">Sun</span>
                            <span class="text-text-primary font-h3 text-[22px] leading-none font-medium">26</span>
                        </button>
                        <button
                            class="flex-shrink-0 w-16 h-20 bg-white rounded-lg flex flex-col items-center justify-center border border-cream-dark hover:border-gold-light/30 transition-colors snap-center">
                            <span class="text-text-muted text-xs font-semibold uppercase tracking-wider mb-1">Mon</span>
                            <span class="text-text-primary font-h3 text-[22px] leading-none font-medium">27</span>
                        </button>
                        <button
                            class="flex-shrink-0 w-16 h-20 flex flex-col items-center justify-center text-primary-container">
                            <span class="material-symbols-outlined">more_horiz</span>
                        </button>
                    </div>
                </div>
                <!-- Time Selector -->
                <div>
                    <label class="font-label-uppercase text-label-uppercase text-text-secondary mb-2 block">Select
                        Time</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button
                            class="py-3 px-2 rounded border border-cream-dark bg-white text-center text-text-secondary font-medium hover:border-gold-light/40 transition-colors text-sm">18:00</button>
                        <button
                            class="py-3 px-2 rounded border border-cream-dark bg-white text-center text-text-secondary font-medium hover:border-gold-light/40 transition-colors text-sm">18:30</button>
                        <button
                            class="py-3 px-2 rounded border-2 border-primary-container bg-primary-container/5 text-center text-primary-container font-semibold shadow-sm text-sm relative">
                            19:00
                            <div class="absolute -right-1 -top-1 w-2 h-2 bg-gold-muted rounded-full"></div>
                        </button>
                        <button
                            class="py-3 px-2 rounded border border-cream-dark bg-white text-center text-text-secondary font-medium hover:border-gold-light/40 transition-colors text-sm">19:30</button>
                        <button
                            class="py-3 px-2 rounded border border-cream-dark bg-white text-center text-text-secondary font-medium hover:border-gold-light/40 transition-colors text-sm">20:00</button>
                        <button
                            class="py-3 px-2 rounded border border-cream-dark bg-surface-dim text-center text-text-muted font-medium opacity-50 cursor-not-allowed text-sm line-through">20:30</button>
                    </div>
                </div>
            </div>
        </section>
        <!-- Guests & Details -->
        <section
            class="bg-surface rounded-xl p-card-padding border border-gold-light/25 shadow-[0_4px_24px_rgba(30,58,95,0.08)]">
            <h2 class="font-h4 text-h4 text-primary-container mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-gold-muted text-[24px]">group</span>
                Details
            </h2>
            <div class="flex items-center justify-between bg-cream rounded-lg p-3 border border-cream-dark mb-4">
                <span class="font-label-uppercase text-label-uppercase text-text-secondary">Guests</span>
                <div class="flex items-center gap-4">
                    <button
                        class="w-8 h-8 rounded-full bg-white border border-cream-dark flex items-center justify-center text-primary-container hover:bg-gold-light/10 active:scale-95 transition-all">
                        <span class="material-symbols-outlined text-[20px]">remove</span>
                    </button>
                    <span class="font-h4 text-h4 text-primary-container w-4 text-center">2</span>
                    <button
                        class="w-8 h-8 rounded-full bg-white border border-cream-dark flex items-center justify-center text-primary-container hover:bg-gold-light/10 active:scale-95 transition-all">
                        <span class="material-symbols-outlined text-[20px]">add</span>
                    </button>
                </div>
            </div>
            <div>
                <label class="font-label-uppercase text-label-uppercase text-text-secondary mb-2 block"
                    for="special-requests">Special Requests (Optional)</label>
                <textarea
                    class="w-full bg-cream border border-cream-dark rounded-lg px-input-padding-x py-input-padding-y text-body-lg text-text-primary focus:border-primary-container focus:ring-2 focus:ring-gold-muted/60 placeholder:text-text-muted transition-all resize-none"
                    id="special-requests" placeholder="Allergies, occasions..." rows="2"></textarea>
            </div>
        </section>
    </main>
    <!-- Bottom Sticky Action Area (Before BottomNavBar) -->
    <div
        class="fixed bottom-[calc(64px+env(safe-area-inset-bottom))] left-0 w-full bg-surface/90 backdrop-blur-md p-4 border-t border-gold-light/20 z-40 lg:hidden shadow-[0_-8px_30px_rgba(16,36,63,0.1)]">
        <div class="flex items-center justify-between mb-3 px-2">
            <span class="text-sm text-text-secondary">Deposit Required</span>
            <span class="font-h4 text-h4 text-primary-container">$50.00</span>
        </div>
        <button
            class="w-full bg-navy-deep text-gold-light border border-gold-muted font-label-uppercase text-label-uppercase py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-gold-muted hover:text-navy-deep active:scale-[0.98] transition-all shadow-md">
            <span class="material-symbols-outlined text-[20px]">lock</span>
            Pay &amp; Confirm
        </button>
    </div>
    <!-- BottomNavBar JSON Render -->
    <nav
        class="lg:hidden fixed bottom-0 w-full z-50 flex justify-around items-center h-16 px-4 pb-safe bg-navy-deep border-t border-gold-light/25 shadow-[0_-4px_24px_rgba(16,36,63,0.3)] rounded-t-xl">
        <a class="flex flex-col items-center justify-center text-gold-light scale-110 active:scale-90 duration-200 hover:text-gold-light transition-transform"
            href="#">
            <span class="material-symbols-outlined mb-1 text-[24px]">calendar_month</span>
            <span class="font-label-uppercase text-[10px] uppercase tracking-wider font-semibold">Book</span>
        </a>
        <a class="flex flex-col items-center justify-center text-cream-dark/50 active:scale-90 duration-200 hover:text-gold-light transition-transform"
            href="#">
            <span class="material-symbols-outlined mb-1 text-[24px]">payments</span>
            <span class="font-label-uppercase text-[10px] uppercase tracking-wider font-semibold">Spend</span>
        </a>
        <a class="flex flex-col items-center justify-center text-cream-dark/50 active:scale-90 duration-200 hover:text-gold-light transition-transform"
            href="#">
            <span class="material-symbols-outlined mb-1 text-[24px]">credit_card</span>
            <span class="font-label-uppercase text-[10px] uppercase tracking-wider font-semibold">Card</span>
        </a>
        <a class="flex flex-col items-center justify-center text-cream-dark/50 active:scale-90 duration-200 hover:text-gold-light transition-transform"
            href="#">
            <span class="material-symbols-outlined mb-1 text-[24px]">support_agent</span>
            <span class="font-label-uppercase text-[10px] uppercase tracking-wider font-semibold">Help</span>
        </a>
    </nav>
    <style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .scrollbar-hide {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }
    </style>
</body>

</html>
